# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  push:
    branches: [ "test-1" ]
  pull_request:
    branches: [ "test-1" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  ai-review:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    outputs:
      output1: ${{ steps.step1.outputs.test }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - id: step1
      uses: favware/ssh-remote-action@v1
      with:
        host: ${{ secrets.HOST_PROD }}
        username: ${{ secrets.HOST_USERNAME }}
        password: ${{ secrets.HOST_PW }}
        port: 22
        command: cd /home/nahyeon/CRITIC && python3 chatbot/custom_chatbot.py >> /home/nahyeon/log.txt && echo /home/nahyeon/log.txt>> "$GITHUB_OUTPUT"
  
  comment:
    runs-on: ubuntu-latest
    needs: ai-review
    steps:
      - env:
          OUTPUT1: ${{needs.ai-review.outputs.output1}}
        run: echo "$OUTPUT1
  
